{% extends "base.html" %}
{% block title %}Your Basket{% endblock %}
{% block content %}
  <h1>Your Basket</h1>

  {% if line_items %}
    <section class="card">
      <table>
        <thead><tr><th>Item</th><th>Quantity</th><th class="col-tight"></th></tr></thead>
        <tbody>
          {% for line in line_items %}
          <tr class="basket-row">
            <td>{{ line.name }}</td>
            <td>
              <form method="post" action="{{ url_for('update_basket_item', key=line.key) }}" class="basket-add-form js-basket-update">
                <div class="qty-stepper">
                  <button type="button" class="qty-step qty-step-down" aria-label="Decrease quantity">&minus;</button>
                  <input type="number" name="quantity" min="1" value="{{ line.quantity }}" inputmode="numeric" aria-label="Quantity of {{ line.name }}">
                  <button type="button" class="qty-step qty-step-up" aria-label="Increase quantity">+</button>
                </div>
                <button type="submit" class="btn btn-small btn-primary">Update</button>
              </form>
            </td>
            <td class="col-tight">
              <form method="post" action="{{ url_for('remove_from_basket', key=line.key) }}" class="js-basket-remove">
                <button type="submit" class="btn btn-small btn-danger">Remove</button>
              </form>
            </td>
          </tr>
          {% endfor %}
        </tbody>
      </table>
    </section>

    <section class="card narrow">
      <h2>Your Details</h2>
      <form method="post">
        <label for="requester_name">Your name</label>
        <input type="text" id="requester_name" name="requester_name" required>

        <label for="requester_email">Your email</label>
        <input type="email" id="requester_email" name="requester_email">

        <label for="message">Notes (dates needed, trip details, etc.)</label>
        <textarea id="message" name="message" rows="4"></textarea>

        <button type="submit" class="btn btn-primary">Submit Request</button>
      </form>
    </section>
  {% else %}
    <p class="empty-state">Your basket is empty. <a href="{{ url_for('request_kit') }}">Browse kit</a> to add items.</p>
  {% endif %}
{% endblock %}
